<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Advanced CSS Selectors Demo</title>
  <link rel="stylesheet" href="selectors.css">
</head>
<body>
  <main style="max-width:700px;margin:32px auto;font-family:Arial,Helvetica,sans-serif">
    <h2>Advanced Selectors — small demo</h2>

    <!-- Input to demonstrate attribute selector [type="text"] and :focus -->
    <form>
      <label for="q">Search:</label>
      <input id="q" type="text" placeholder="Type & focus me">
      <button type="submit">Go</button>
    </form>

    <!-- List demonstrating many selectors -->
    <ul class="items">
      <li>Simple item</li>

      <!-- direct child (>) used in CSS to style this img inside li -->
      <li><img src="file:///mnt/data/6aac6e24-8707-4640-bdfd-facf0c25011d.png" alt="pic" width="60"></li>

      <li><a href="https://example.com">Secure Link (starts with https)</a></li>
      <li><a href="http://example.com">Insecure Link</a></li>

      <li class="lead">Lead item (highlighted)</li>

      <li>Sibling 1</li>
      <li>Sibling 2 (adjacent)</li>
      <li>Sibling 3 (general sibling)</li>
    </ul>

    <p class="note">Hover items, use keyboard to focus input, and resize to test <code>:nth-child()</code>.</p>
  </main>
</body>
</html>
