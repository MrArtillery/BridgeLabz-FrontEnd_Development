<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">My Gradient Page</header>

  <main>
    <section class="hero linear">
      <div class="content">
        <h1>Linear Gradient</h1>
        <p>This section uses a linear gradient with <code>background-attachment: fixed</code> for a parallax-like effect.</p>
      </div>
    </section>

    <section class="panel radial">
      <div class="content">
        <h1>Radial Gradient</h1>
        <p>Radial gradient centered here — good for spotlight effects.</p>
        <!-- small illustration from your uploaded file -->
        <img src="file:///mnt/data/6aac6e24-8707-4640-bdfd-facf0c25011d.png" alt="illustration" class="illus">
      </div>
    </section>
  </main>

  <footer class="foot">© 2025 • Example Footer</footer>

</html>
